lints.workspace = true

[package]
name = "defuse-wallet-sui-feature-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[test]]
name = "schemes"
path = "tests.rs"
required-features = ["matrix"]

[features]
# Ordinary workspace tests must not mistake unified dependency features for isolation.
matrix = []
ed25519 = ["defuse-wallet-sui/ed25519"]
secp256k1 = ["defuse-wallet-sui/secp256k1"]
p256 = ["defuse-wallet-sui/p256"]

# A separate consumer avoids the Sui library's all-schemes self dev-dependency.
[dependencies]
base64.workspace = true
borsh.workspace = true
defuse-wallet.workspace = true
defuse-wallet-sui = { workspace = true, default-features = false }
near-sdk = { workspace = true, features = ["unit-testing"] }
serde_json.workspace = true
